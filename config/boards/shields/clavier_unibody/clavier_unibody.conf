# ==========================================================================
# Clavier Unibody 64keys - システム機能設定
# ==========================================================================

# --------------------------------------------------------------------------
# 1. 接続設定（BLE無線 + USB、左右一体・単一マイコンなのでSPLIT設定は不要）
# --------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# --------------------------------------------------------------------------
# 2. 省電力・スリープタイマー設定
# --------------------------------------------------------------------------
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
# 【2026-09-24】ディープスリープ(ほぼ完全な電源断)からは、MCP23017経由の
# キースキャンがポーリング方式であるためキー入力では復帰できず(SENSE割り込みが
# 設定されないため)、USBケーブル接続、または本体のリセットボタン(このキーボードは
# ケースに覆われていて物理的に押せない)でしか復帰できない。ケーブルを持たない
# 状態でディープスリープに入ると詰んでしまうため、通常の未使用時間(数時間程度)
# では絶対に入らないよう24時間まで延長。完全無効化はせず、長期間放置時の
# バッテリー保護策として残す。
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=86400000

# --------------------------------------------------------------------------
# 3. UART（シリアル）ドライバの停止
# --------------------------------------------------------------------------
# P1.11(Col6)・P1.12を解放するため、デフォルトで有効なUARTドライバを完全に止める。
# ※検証のため一時的にy(「しばらく使うと反応しなくなる」不具合の調査用)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n

# --------------------------------------------------------------------------
# 5. [検証用・一時的] USBシリアルログ出力(診断が終わったら削除する)
# --------------------------------------------------------------------------
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500

# --------------------------------------------------------------------------
# 4. MCP23017 (I2C IOエクスパンダー) 用設定
# --------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# MCP23017経由のGPIOはネイティブGPIOのような割り込み(GPIOTE)を出せないため、
# キースキャンをタイマーによる定期ポーリング方式にする。
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
