# ==========================================================================
# Clavier Unibody 64keys - システム機能設定
# ==========================================================================

# --------------------------------------------------------------------------
# 1. 接続設定（BLE無線 + USB、左右一体・単一マイコンなのでSPLIT設定は不要）
# --------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# --------------------------------------------------------------------------
# 2. 省電力・スリープタイマー設定
# --------------------------------------------------------------------------
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --------------------------------------------------------------------------
# 3. UART（シリアル）ドライバの停止
# --------------------------------------------------------------------------
# P1.11(Col6)・P1.12を解放するため、デフォルトで有効なUARTドライバを完全に止める。
# ZMKのログ出力はUSB(CDC ACM)経由で行うため、有線シリアルは不要。
# ※デバッグ中はUSB CDC ACMコンソールを使うため一時的にy(診断が終わったらnに戻す)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n

# --------------------------------------------------------------------------
# 5. [デバッグ用・一時的] USBシリアルログ出力(診断が終わったら削除する)
# --------------------------------------------------------------------------
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500
# バッファを大きくしても状況が変わらず、逆に捕捉できたログの一部が途中で
# 他の行と混ざって(文字化けのように)結合されていたことが判明。3秒分の
# ログが一気にバースト送信され、PC側の読み取りが追いつかず取りこぼして
# いた疑いが強いため、遅延を短くして一度に流れる量を減らす。
CONFIG_LOG_BUFFER_SIZE=16384

# --------------------------------------------------------------------------
# 4. MCP23017 (I2C IOエクスパンダー) 用設定
# --------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# MCP23017経由のGPIOはネイティブGPIOのような割り込み(GPIOTE)を出せないため、
# キースキャンをタイマーによる定期ポーリング方式にする。
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# (CONFIG_PM_DEVICE=n を試したところ、ZMK本体のスリープ機能(app/src/pm.c)が
#  PM_DEVICE APIを前提に直接呼び出す作りのためリンクエラーになった。
#  代わりにforce_resume.cで明示的にRESUMEを発行して検証する)
